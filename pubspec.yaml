name: loyalty_benefit_app
description: "Aplicación de clientes para Loyalty Benefit."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  go_router: ^14.8.1
  file_picker: ^13.3.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  web:
    generate: true
    image_path: "web/icons/app_icon.png"
    theme_color: "#4F46E5"
  windows:
    generate: true
    image_path: "web/icons/app_icon.png"
    icon_size: 256


